<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SwipyUI — Angular UI Components</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="SwipyUI is an Angular UI component library with design-token based theming."
    />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      // Light mode is the default; apply dark only when the user explicitly chose it.
      if (localStorage.getItem('syui-theme') === 'dark') {
        document.documentElement.classList.add('syui-dark');
      }
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
